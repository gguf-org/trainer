[build-system]
requires = ["flit_core>=3.4"]
build-backend = "flit_core.buildapi"

[project]
name = "gguf-trainer"
authors = [{name = "gguf", email = "info@gguf.us"}]
description = "Train pig_clip adapters that replace a diffusion model's text encoder in ggk (LLaDA-Image, MageFlow-Edit) — GUI, downloads, resumable pipeline, f16 GGUF export"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.51",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
    "datasets>=2.19",
    "pyarrow>=14",
    "gguf-connector>=3.7.1",
    "pillow>=9",
    "numpy>=1.24",
    "psutil>=5.9",
]
dynamic = ["version"]

[project.scripts]
gguf-trainer = "gguf_trainer.__main__:main"

[project.urls]
Repository = "https://github.com/gguf-org/ggk"

[tool.flit.module]
name = "gguf_trainer"
